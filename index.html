<!DOCTYPE html>
<html lang="en"><head>
<meta name="parlo-data" content="it"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B6B3A"><link rel="icon" type="image/png" href="./icons/favicon.png"><link rel="apple-touch-icon" href="./icons/icon-192.png"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/png" href="./icons/icon-192.png"><link rel="apple-touch-icon" href="./icons/icon-192.png"><title>Parlo</title>
<style>
:root{--bg:#FBF5EA;--bg2:#F1E7D3;--card:#fff;--ink:#241B14;--mut:#8C7C6A;--g:#0E8A4B;--gd:#096B3A;--gl:#e3f5ea;--r:#E4382F;--rd:#B82820;--y:#FFC83D;--yd:#D9A21B;--b:#3D8BFF;--line:#E9DCC3;--sh:0 0.375rem 0 rgba(36,27,20,.07),0 0.875rem 1.875rem rgba(36,27,20,.07);--hd1:#0B6B3A;--hd2:#18a35a}
body.night{--bg:#14111C;--bg2:#1E1A2B;--card:#262136;--ink:#F6EFE3;--mut:#A79DB8;--line:#3A334F;--sh:0 0.375rem 0 rgba(0,0,0,.35);--gl:#1d3a2b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16.5px}html.fs0{font-size:14px}html.fs2{font-size:18px}html.fs3{font-size:19px}
html,body{margin:0;height:100%;background:#0b3d23;font-family:var(--parlo-font);color:var(--ink)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
/* Parlo unified typography: no external webfont requests or internet dependency. */
@font-face{font-family:'Parlo Serif';src:url(./fonts/parlo-serif-regular.woff) format('woff');font-weight:400;font-style:normal;font-display:swap}@font-face{font-family:'Parlo Serif';src:url(./fonts/parlo-serif-bold.woff) format('woff');font-weight:700 900;font-style:normal;font-display:swap}:root{--parlo-font:"Williwaw Book","Parlo Serif",Georgia,"Palatino Linotype","Book Antiqua",serif}
html,body,#app,#main,#top,#nav,#les,#stage,.sheet,.modal,.pl-studio,.p221-workspace{font-family:var(--parlo-font)}
button,input,textarea,select,option,optgroup,fieldset,legend{font-family:var(--parlo-font)!important;font-size:inherit}
button,input,textarea,select{font-style:normal;letter-spacing:normal}
h1,h2,h3,h4,h5,h6,.logo,.q,.word{font-family:var(--parlo-font);font-synthesis:weight}
/* Consistent sizes and comfortable letterforms for compact action labels. */
.pl-studio button,.p221-quick button,.p221-workspace button,.pl-toolgrid button,.v187-tiles button,.v194-hublinks button{font-family:var(--parlo-font)!important;line-height:1.28}
input::placeholder,textarea::placeholder{font-family:var(--parlo-font);opacity:.75}

svg.ic{display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.ic.f{fill:currentColor;stroke:none}
body.rm *{animation:none!important;transition:none!important}
#app{position:relative;max-width:35rem;height:100%;margin:0 auto;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
#top{padding:calc(env(safe-area-inset-top) + 0.625rem) 0.875rem 0.875rem;display:flex;align-items:center;gap:0.5rem;background:linear-gradient(135deg,var(--hd1),var(--hd2));color:#fff;position:relative;z-index:5;border-radius:0 0 1.875rem 1.875rem;box-shadow:0 0.5rem 1.5rem rgba(0,0,0,.22);overflow:hidden}
#top:before{content:"";position:absolute;right:-2.5rem;top:-3.75rem;width:11.25rem;height:11.25rem;border-radius:50%;background:rgba(255,255,255,.08)}
#top:after{content:"";position:absolute;left:30%;bottom:-4.375rem;width:8.75rem;height:8.75rem;border-radius:50%;background:rgba(255,255,255,.06)}
#top>*{position:relative;z-index:1}
.logo{font-weight:900;font-size:1.5rem;letter-spacing:-0.0312rem;display:flex;align-items:center;gap:0.5rem}
.logo i{width:2.125rem;height:2.125rem;border-radius:0.6875rem;background:#fff;color:var(--hd1);display:grid;place-items:center;transform:rotate(-6deg);box-shadow:0 0.1875rem 0 rgba(0,0,0,.18)}
.chip{background:rgba(255,255,255,.18);border-radius:62.4375rem;padding:0.375rem 0.6875rem;font-weight:800;font-size:0.9375rem;display:flex;align-items:center;gap:0.3125rem;backdrop-filter:blur(0.375rem);color:#fff}
.chip.ib{padding:0.4375rem}
.sp{flex:1}
#ring{position:relative;width:2.5rem;height:2.5rem}
#ring svg{transform:rotate(-90deg)}
#ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:0.6875rem}
#main{background-image:radial-gradient(circle at 1.25rem 1.25rem,rgba(14,138,75,.06) 0.1875rem,transparent 0.25rem),radial-gradient(circle at 3.125rem 3.125rem,rgba(228,56,47,.05) 0.1875rem,transparent 0.25rem);background-size:3.75rem 3.75rem;flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scroll-behavior:smooth;padding-bottom:6.5rem}
#nav{position:absolute;left:0.75rem;right:0.75rem;bottom:calc(env(safe-area-inset-bottom) + 0.625rem);background:var(--card);border-radius:1.75rem;display:flex;padding:0.375rem;box-shadow:0 0.75rem 2.125rem rgba(0,0,0,.25);z-index:6;border:0.125rem solid var(--line)}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:0.1875rem;padding:0.5rem 0 0.4375rem;border-radius:1.375rem;font-size:0.7188rem;font-weight:800;color:var(--mut);transition:.25s}
#nav button.on{background:var(--gl);color:var(--g)}
#nav button.on svg{transform:translateY(-0.125rem) scale(1.12)}
#nav svg{transition:.25s}
.view{animation:vin .35s ease both}
@keyframes vin{from{opacity:0;transform:translateY(0.875rem)}to{opacity:1;transform:none}}
h2{margin:1.25rem 1.125rem 0.625rem;font-size:1.25rem;display:flex;align-items:center;gap:0.5rem}
h2 svg{color:var(--g)}
.card{background:var(--card);border-radius:1.5rem;border:0.125rem solid var(--line);box-shadow:var(--sh);padding:0.875rem}
.btn{display:flex;align-items:center;justify-content:center;gap:0.5rem;width:100%;padding:1rem;border-radius:1.25rem;font-weight:900;letter-spacing:0.0375rem;color:#fff;background:var(--g);box-shadow:0 0.3125rem 0 var(--gd);text-transform:uppercase;font-size:0.9375rem;transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(0.25rem);box-shadow:0 0.0625rem 0 var(--gd)}
.btn.red{background:var(--r);box-shadow:0 0.3125rem 0 var(--rd)}.btn.red:active{box-shadow:0 0.0625rem 0 var(--rd)}
.btn.ghost{background:var(--card);color:var(--mut);box-shadow:0 0.3125rem 0 var(--line);border:0.125rem solid var(--line)}
.btn[disabled]{background:var(--line);color:var(--mut);box-shadow:0 0.3125rem 0 #d6c8ad;pointer-events:none}
/* icon tiles */
.wi{flex:none;display:grid;place-items:center;border-radius:30%;color:#fff;font-weight:900;box-shadow:inset 0 -0.3125rem 0 rgba(0,0,0,.14),0 0.5rem 1.125rem rgba(0,0,0,.14);margin:0 auto;position:relative;overflow:hidden}
.wi:before{content:"";position:absolute;left:-20%;top:-30%;width:90%;height:70%;background:rgba(255,255,255,.18);border-radius:50%;transform:rotate(-20deg)}
.wi.sw{border:0.25rem solid #fff;box-shadow:0 0 0 0.125rem var(--line),0 0.5rem 1.125rem rgba(0,0,0,.14)}
.wi.sw:before{display:none}
.wi>*{position:relative}
/* hero */
.hero{margin:1rem 0.875rem 0.375rem;padding:1rem;border-radius:1.75rem;background:linear-gradient(135deg,#fff,#FFF1D6);border:0.125rem solid var(--line);box-shadow:var(--sh);position:relative;overflow:hidden}
body.night .hero{background:linear-gradient(135deg,#2b2640,#352c4d)}
.hero .row1{display:flex;align-items:center;gap:0.75rem}
.hero h1{margin:0;font-size:1.3125rem;line-height:1.15}.hero p{margin:0.3125rem 0 0;color:var(--mut);font-size:0.8438rem}
.gl{height:0.75rem;background:var(--bg2);border-radius:0.5625rem;overflow:hidden;margin:0.875rem 0 0.375rem}.gl i{display:block;height:100%;background:linear-gradient(90deg,var(--y),#ff9a3d);border-radius:0.5625rem;transition:width .6s}
.hero .meta{display:flex;justify-content:space-between;font-size:0.7812rem;font-weight:800;color:var(--mut);margin-bottom:0.75rem}
/* path */
.unit{margin:1.375rem 0.875rem 0;border-radius:1.75rem;padding:1.125rem 1.25rem;color:#fff;position:relative;overflow:hidden;box-shadow:0 0.5rem 0 rgba(0,0,0,.14),0 1rem 1.875rem rgba(0,0,0,.12)}
.unit .bgic{position:absolute;right:-0.875rem;bottom:-1.5rem;opacity:.22;transform:rotate(-12deg)}
.unit .wave{position:absolute;left:0;right:0;bottom:0;opacity:.14}
.unit small{opacity:.9;font-weight:800;letter-spacing:0.075rem;font-size:0.6875rem;display:flex;align-items:center;gap:0.3125rem}
.unit h3{margin:0.25rem 0 0.125rem;font-size:1.75rem;letter-spacing:-0.05rem}
.unit p{margin:0;opacity:.95;font-size:0.875rem}
.unit .pb{height:0.5625rem;background:rgba(255,255,255,.28);border-radius:0.5625rem;margin-top:0.75rem;width:65%;overflow:hidden}
.unit .pb i{display:block;height:100%;background:#fff;border-radius:0.5625rem;transition:width .6s}
.trail{position:relative;margin:0 0.875rem}
.trail svg.line{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;width:5.5rem;height:5.125rem;margin-left:-2.75rem;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--c);box-shadow:0 0.5rem 0 var(--cd),0 0.875rem 1.25rem rgba(0,0,0,.12);transition:transform .12s,box-shadow .12s}
.node:before{content:"";position:absolute;left:10%;top:6%;width:56%;height:38%;border-radius:50%;background:rgba(255,255,255,.28);transform:rotate(-18deg)}
.node:active{transform:translateY(0.375rem);box-shadow:0 0.125rem 0 var(--cd)}
.node.lock{background:#d3c8b3;--cd:#b8ab93;color:#fff}
body.night .node.lock{background:#4a4360;--cd:#383251}
.node.cur{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0.5rem 0 var(--cd),0 0 0 0 rgba(255,200,61,.85)}60%{box-shadow:0 0.5rem 0 var(--cd),0 0 0 1.125rem rgba(255,200,61,0)}}
.node .st{position:absolute;bottom:-1.125rem;display:flex;gap:0.0625rem;color:#FFC83D;filter:drop-shadow(0 0.125rem 0 rgba(0,0,0,.25))}
.node .st .off{color:#d9cdb5}
.go{position:absolute;top:-2.5rem;background:#fff;color:var(--gd);font-weight:900;font-size:0.75rem;padding:0.375rem 0.75rem;border-radius:0.8125rem;border:0.125rem solid var(--line);animation:bob 1s ease-in-out infinite;white-space:nowrap;letter-spacing:0.0312rem}
.go:after{content:"";position:absolute;left:50%;bottom:-0.4375rem;width:0.625rem;height:0.625rem;background:#fff;border:0.125rem solid var(--line);border-top:0;border-left:0;transform:translateX(-50%) rotate(45deg)}
@keyframes bob{50%{transform:translateY(-0.3125rem)}}
.deco{position:absolute;opacity:.16;animation:fl 5s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-0.5rem) rotate(8deg)}}
.mascot{width:5.75rem;height:7rem;flex:none;animation:wob 3s ease-in-out infinite;transform-origin:50% 100%}
@keyframes wob{50%{transform:rotate(4deg)}}
/* lesson overlay */
#les{position:absolute;inset:0;background:var(--bg);z-index:20;display:none;flex-direction:column}
#les.on{display:flex;animation:vin .3s}
#lt{display:flex;align-items:center;gap:0.625rem;padding:calc(env(safe-area-inset-top) + 0.875rem) 1rem 0.375rem}
#lt .x{color:var(--mut);width:2.25rem;height:2.25rem;display:grid;place-items:center;border-radius:0.75rem}
.bar{flex:1;height:1.125rem;background:var(--line);border-radius:0.75rem;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#46d37f,var(--g));border-radius:0.75rem;transition:width .4s;position:relative}
.bar i:after{content:"";position:absolute;left:0.5rem;right:0.5rem;top:0.25rem;height:0.25rem;background:rgba(255,255,255,.4);border-radius:0.25rem}
#hearts{display:flex;gap:0.125rem;color:var(--r);align-items:center;font-weight:900}
#hearts .off{color:var(--line)}
#stage{flex:1;overflow-y:auto;padding:0.75rem 1.25rem 10.625rem;display:flex;flex-direction:column}
.q{font-size:1.375rem;font-weight:900;margin:0.5rem 0 1rem;letter-spacing:-0.0187rem}
.word{font-size:2.375rem;font-weight:900;text-align:center;letter-spacing:-0.05rem;color:var(--gd);margin:0.875rem 0 0.125rem}
body.night .word{color:#7ee2a8}
.sub{text-align:center;color:var(--mut);font-weight:700;margin:0.25rem 0}
.spkrow{display:flex;justify-content:center;gap:0.75rem;margin:0.75rem 0}
.spk{display:inline-grid;place-items:center;width:3.875rem;height:3.875rem;border-radius:50%;background:var(--b);color:#fff;box-shadow:0 0.3125rem 0 #2468c9;font-weight:900;font-size:0.8125rem}
.spk.slow{background:#7a6cff;box-shadow:0 0.3125rem 0 #5448cc;flex-direction:column;line-height:1}
.spk.big{width:6.5rem;height:6.5rem}
.spk:active{transform:translateY(0.25rem);box-shadow:none}
.opts{display:grid;gap:0.6875rem;margin-top:0.75rem}
.opt{padding:1rem 1.125rem;border-radius:1.25rem;border:0.125rem solid var(--line);background:var(--card);font-weight:800;font-size:1.125rem;text-align:left;box-shadow:0 0.25rem 0 var(--line);display:flex;align-items:center;gap:0.75rem;transition:.15s}
.opt.sel{border-color:var(--b);background:#e8f1ff;box-shadow:0 0.25rem 0 #a9c8ff;color:#1b4fa8}
.opt.ok{border-color:var(--g);background:#dff6e7;box-shadow:0 0.25rem 0 #9dd9b3;color:var(--gd)}
.opt.bad{border-color:var(--r);background:#ffe3e1;box-shadow:0 0.25rem 0 #f3aaa5;color:var(--rd);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-0.375rem)}75%{transform:translateX(0.375rem)}}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:0.75rem}
.pairs .opt{justify-content:center;text-align:center;min-height:4.125rem;font-size:1.0312rem}
.opt.gone{visibility:hidden}
.tray{min-height:4.125rem;border-bottom:0.125rem solid var(--line);display:flex;flex-wrap:wrap;gap:0.5rem;padding:0.5rem 0;margin-bottom:1rem;align-content:flex-start}
.tiles{display:flex;flex-wrap:wrap;gap:0.5625rem;justify-content:center}
.tile{padding:0.6875rem 0.9375rem;border-radius:0.9375rem;border:0.125rem solid var(--line);background:var(--card);font-weight:800;font-size:1.125rem;box-shadow:0 0.25rem 0 var(--line);animation:pop .2s}
.tile.used{visibility:hidden}
@keyframes pop{from{transform:scale(.8)}}
input.ti{width:100%;padding:1.0625rem;font-size:1.5rem;font-weight:800;border-radius:1.25rem;border:0.125rem solid var(--line);background:var(--card);color:var(--ink);outline:0;text-align:center}
input.ti:focus{border-color:var(--b)}
.acc{display:flex;gap:0.5rem;justify-content:center;margin-top:0.75rem}.acc button{width:2.875rem;height:2.875rem;border-radius:0.8125rem;background:var(--card);border:0.125rem solid var(--line);font-weight:900;font-size:1.1875rem}
#foot{position:absolute;left:0;right:0;bottom:0;padding:0.875rem 1.25rem calc(env(safe-area-inset-bottom) + 1.125rem);transition:.3s;border-top:0.125rem solid var(--line);background:var(--bg)}
#foot.ok{background:#d9f5e3;border-color:#a8e3bd}#foot.bad{background:#ffe0de;border-color:#f6b3ae}
#fb{display:none;margin-bottom:0.75rem;font-weight:900;font-size:1.1875rem;align-items:center;gap:0.625rem}
#foot.ok #fb,#foot.bad #fb{display:flex}
#foot.ok #fb{color:var(--gd)}#foot.bad #fb{color:var(--rd)}
#fb small{display:block;font-weight:700;font-size:0.9062rem;margin-top:0.125rem}
.res{text-align:center;padding-top:1rem}
.res h1{font-size:1.875rem;margin:0.625rem 0 0.25rem;letter-spacing:-0.05rem}
.stars3{display:flex;justify-content:center;gap:0.375rem;color:#FFC83D;margin:0.5rem 0}.stars3 .off{color:var(--line)}
.stars3 svg:nth-child(2){transform:translateY(-0.5rem)}
.stats3{display:flex;gap:0.625rem;margin:1.125rem 0}.stats3 div{flex:1;border-radius:1.25rem;padding:0.75rem 0.25rem;color:#fff;font-weight:900;font-size:1.375rem;display:flex;flex-direction:column;align-items:center;gap:0.125rem}.stats3 small{display:block;font-size:0.6875rem;opacity:.92;letter-spacing:0.0625rem}
canvas#cf{position:absolute;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
/* cards */
.fc{perspective:56.25rem;margin:0.75rem 1.125rem;height:20rem}
.fci{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.fc.flip .fci{transform:rotateY(180deg)}
.fcf,.fcb{position:absolute;inset:0;backface-visibility:hidden;border-radius:2rem;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.25rem;text-align:center;border:0.1875rem solid #fff;box-shadow:0 0.75rem 0 rgba(0,0,0,.1),0 1.25rem 2.25rem rgba(0,0,0,.12)}
.fcf{background:linear-gradient(145deg,#fff,#fff1d4);color:var(--ink)}
body.night .fcf{background:linear-gradient(145deg,#2d2742,#241f36)}
.fcb{background:linear-gradient(145deg,var(--g),#1fae63);color:#fff;transform:rotateY(180deg)}
.fcf .w{font-size:2.625rem;font-weight:900;color:var(--gd);margin-top:0.875rem}
.fcb .w{font-size:2.25rem;font-weight:900}
.rate{display:flex;gap:0.625rem;padding:0 1.125rem}.rate button{flex:1;padding:0.9375rem 0.25rem;border-radius:1.125rem;font-weight:900;color:#fff}
.seg{display:flex;gap:0.375rem;margin:0.875rem 1rem;background:var(--bg2);padding:0.3125rem;border-radius:1.125rem}.seg button{flex:1;padding:0.625rem;border-radius:0.875rem;font-weight:800;color:var(--mut)}.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 0.125rem 0 var(--line)}
.wl{display:flex;align-items:center;gap:0.875rem;padding:0.6875rem 0.875rem;margin:0 0.875rem 0.625rem;border-radius:1.25rem;background:var(--card);border:0.125rem solid var(--line)}
.wl .wi{margin:0}.wl b{font-size:1.125rem}.wl small{display:block;color:var(--mut)}
.dots{margin-left:auto;display:flex;gap:0.1875rem}.dots i{width:0.5rem;height:0.5rem;border-radius:50%;background:var(--line)}.dots i.f{background:var(--y)}
/* talk */
.scn{display:flex;align-items:center;gap:0.875rem;margin:0 0.875rem 0.875rem;padding:1rem;border-radius:1.625rem;color:#fff;box-shadow:0 0.4375rem 0 rgba(0,0,0,.14),0 0.875rem 1.5rem rgba(0,0,0,.1);text-align:left;width:calc(100% - 1.75rem);position:relative;overflow:hidden}
.scn .t{width:3.5rem;height:3.5rem;border-radius:1.125rem;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
.scn b{font-size:1.25rem;display:block}.scn small{opacity:.92}
.chat{padding:0.625rem 1rem 9.375rem}
.bub{max-width:84%;padding:0.8125rem 0.9375rem;border-radius:1.375rem;margin:0.625rem 0;font-weight:700;animation:pop .25s;position:relative}
.bub.l{background:var(--card);border:0.125rem solid var(--line);border-bottom-left-radius:0.375rem}
.bub.r{background:var(--g);color:#fff;margin-left:auto;border-bottom-right-radius:0.375rem}
.bub small{display:block;opacity:.75;font-weight:600;margin-top:0.1875rem}
.who{font-size:0.75rem;color:var(--mut);font-weight:900;margin:0.75rem 0 -0.375rem;display:flex;align-items:center;gap:0.375rem}
/* profile + settings */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;margin:0 0.875rem}
.stat{padding:1rem;border-radius:1.5rem;color:#fff;font-weight:900;font-size:1.75rem;box-shadow:0 0.375rem 0 rgba(0,0,0,.14);display:flex;flex-direction:column;gap:0.125rem;position:relative;overflow:hidden}.stat small{display:block;font-size:0.7812rem;opacity:.92}
.stat svg.bg{position:absolute;right:-0.5rem;top:-0.5rem;opacity:.22}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:0.5625rem;margin:0 0.875rem}
.bd{text-align:center;padding:0.75rem 0.125rem;border-radius:1.25rem;background:var(--card);border:0.125rem solid var(--line);font-size:0.6875rem;font-weight:800;color:var(--mut)}.bd .wi{width:2.75rem;height:2.75rem;margin-bottom:0.375rem;background:#cfc4ae;box-shadow:none}.bd.on .wi{background:linear-gradient(135deg,#FFC83D,#ff9a3d)}.bd.on{color:var(--ink);border-color:var(--y)}
.set{margin:0 0.875rem 0.75rem;border-radius:1.5rem;background:var(--card);border:0.125rem solid var(--line);box-shadow:var(--sh);overflow:hidden}
.set .row{display:flex;align-items:center;gap:0.75rem;padding:0.875rem 1rem;font-weight:800;border-bottom:0.125rem solid var(--bg2)}
.set .row:last-child{border:0}

    '<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1.5rem;gap:0.75rem"><div style="width:4.5rem;height:4.5rem;border-radius:1.25rem;background:#0E8A4B;color:#fff;display:grid;place-items:center"><svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.871l-8.106 -13.534a1.914 1.914 0 0 0 -3.274 0z"/><path d="M12 16h.01"/></svg></div>'+
    '<h1 style="margin:0;font-size:1.4rem">'+(title||'')+'</h1><p style="margin:0;max-width:22rem;line-height:1.45;font-weight:600;color:#43708a">'+text+'</p>'+
    '<button id="pde-retry" style="margin-top:0.5rem;border:0;border-radius:1.25rem;background:#0E8A4B;color:#fff;font:inherit;font-weight:900;padding:0.9rem 1.6rem;box-shadow:0 0.3rem 0 #096B3A">'+(window.__UII18N_ready?window.__t('try_again'):'&#8635;')+'</button>'+
    (other?'<button id="pde-def" style="border:0.125rem solid #d3e9f3;border-radius:1.25rem;background:#fff;color:#0b3a52;font:inherit;font-weight:800;padding:0.7rem 1.4rem">Use '+DEFAULT+'_data</button>':'')+'</div>';
    document.body.appendChild(d);
    document.getElementById('pde-retry').onclick=function(){location.reload()};
    document.getElementById('pde-back').onclick=function(){if(history.length>1)history.back();else if(other){try{localStorage.removeItem(KEY)}catch(e){}location.href=location.pathname}else location.reload()};
    var b=document.getElementById('pde-def');if(b)b.onclick=function(){try{localStorage.removeItem(KEY)}catch(e){}location.href=location.pathname}}
  function run(){
    var blocks=document.querySelectorAll('script[type="text/plain"][data-parlo-app]');
    try{document.body.setAttribute('data-course',COURSE)}catch(e){}
    for(var i=0;i<blocks.length;i++){var s=document.createElement('script');s.text=blocks[i].textContent;document.head.appendChild(s)}
    if(document.readyState==='complete')window.dispatchEvent(new Event('load'))}
  /* languages.json (repo root) lists the languages. If it cannot be read, the built-in three are used. */
  var BUILTIN=[{code:'en',name:'English',label:'EN',dir:'ltr'},{code:'fr',name:'Français',label:'FR',dir:'ltr'},{code:'ar',name:'العربية',label:'AR',dir:'rtl'}];
  var LEG=['en','fr','ar'];
  var manP=fetch('./languages.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(function(m){
    var seen={},out=[];(m.languages||[]).forEach(function(x){if(x&&/^[a-z]{2,3}(-[A-Za-z0-9]+)?$/.test(x.code||'')&&!seen[x.code]){seen[x.code]=1;out.push({code:x.code,name:x.name||x.code,label:x.label||x.code.toUpperCase(),dir:x.dir==='rtl'?'rtl':'ltr'})}});
    if(!seen.en)out.unshift(BUILTIN[0]);return out}).catch(function(){return BUILTIN}).then(function(l){window.__LANGS=l;return l});
  var packsP=manP.then(function(L){return Promise.all(L.map(function(x){return fetch('./i18n/'+x.code+'.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).catch(function(){return {strings:{}}})}))});
  function packMap(L,packs){var o={};L.forEach(function(x,i){o[x.code]=packs[i]});return o}
  function J(u){return fetch(u,{cache:'no-cache'}).then(function(r){if(!r.ok)throw Error(u+' (HTTP '+r.status+')');return r.json()})}
  function unesc(x){return x.replace(/~1/g,'/').replace(/~0/g,'~')}
  /* Overlay: every translatable text is stored in it_data/it-data.<lang>.json under a path into the base file.
     Texts of the chosen language are written into the base; the fallback language (English) fills any gap.
     Keys ending in /@ are words that carry all languages side by side (en, fr, ar): all languages are set. */
  var SLOT={en:1,fr:2,ar:3};
  function xslot(l,base){var x=(window.__LANGS||[]).map(function(y){return y.code}).filter(function(c){return LEG.indexOf(c)<0});var j=x.indexOf(l);return j<0?-1:base+j}
  function at(data,k){var p=k.split('/').map(unesc),o=data,i;for(i=0;i<p.length&&o!==undefined&&o!==null;i++)o=o[p[i]];return o}
  function overlay(data,ix,files){
    var langs=(window.__LANGS||[]).map(function(x){return x.code}).filter(function(l){return files[l]}),fb=ix.fallback||'en',hint='en';
    try{hint=(JSON.parse(localStorage.getItem(window.__COURSE_KEY||'parlo2')||'{}').cfg||{}).hint||'en'}catch(e){}
    var cur=files[hint]?hint:fb,fs=files[fb]?files[fb].strings:{},cs=files[cur].strings,names={},seen={},keys=[];
    langs.forEach(function(l){names[l]=files[l].languageName});
    Object.keys(fs).forEach(function(k){seen[k]=1;keys.push(k)});Object.keys(cs).forEach(function(k){if(!seen[k])keys.push(k)});
    keys.forEach(function(k){
      var p=k.split('/').map(unesc),o=data,i;
      for(i=0;i<p.length-1&&o;i++)o=o[p[i]];
      if(!o||typeof o!=='object')return;
      var last=p[p.length-1];
      if(last==='@'){langs.forEach(function(l){var v=files[l].strings[k];if(v!==undefined&&v!==''){if(Array.isArray(o)){var si=SLOT[l]||xslot(l,4);if(si>0)o[si]=v}else o[l]=v}});return}
      if(/^#\d+$/.test(last))return;
      var v=cs[k];if(v===undefined||v==='')v=fs[k];if(v!==undefined)o[last]=v});
    /* Tables: one string with a line per entry (it|en|fr|ar|...). Meaning slots take every language, text slots the chosen one. */
    (ix.tables||[]).forEach(function(t){
      var paths=[];
      if(t.children){var par=at(data,t.path);Object.keys(par||{}).forEach(function(c){paths.push(t.path+'/'+c.replace(/~/g,'~0').replace(/\//g,'~1'))})}
      else paths.push(t.path);
      var xb=0;if(t.meaning){Object.keys(t.meaning).forEach(function(k){xb=Math.max(xb,t.meaning[k])});t.text.forEach(function(s){xb=Math.max(xb,s)});xb++}
      paths.forEach(function(tp){
        var pp=tp.split('/').map(unesc),holder=data,i;
        for(i=0;i<pp.length-1&&holder;i++)holder=holder[pp[i]];
        if(!holder||typeof holder[pp[pp.length-1]]!=='string')return;
        var lines=holder[pp[pp.length-1]].split('\n');
        for(var n=0;n<lines.length;n++){
          var key=tp+'/#'+n,f=lines[n].split('|');
          if(t.meaning)langs.forEach(function(l){var v=files[l].strings[key];if(v===undefined)return;var si=t.meaning[l]||xslot(l,xb);if(si>0){while(f.length<si)f.push('');f[si]=v.split('|')[0]}});
          var cv=cs[key],fv=fs[key],off=t.meaning?1:0;
          t.text.forEach(function(slot,j){var a=(cv!==undefined&&cv.split('|')[off+j]),b=fv!==undefined?fv.split('|')[off+j]:'';f[slot]=a?a:b});
          lines[n]=f.join('|')}

    data.languageNames=names;window.__DATA_LANG=cur;window.__DATA_LANGS=langs;window.__DATA_COURSE=COURSE;
    return data}
  var dataP=J(file).then(function(ix){
    var base=ix.base||'it-data.json',fb=ix.fallback||'en';
    return manP.then(function(L){var langs=L.map(function(x){return x.code});if(langs.indexOf(fb)<0)langs.unshift(fb);return Promise.all([J(DIR+base)].concat(langs.map(function(l){
      return J(DIR+base.replace(/\.json$/,'.'+l+'.json')).catch(function(e){if(l===fb)throw e;return null})}))).then(function(r){
      var files={};langs.forEach(function(l,i){files[l]=r[i+1]});
      return overlay(r[0],ix,files)})})});
  Promise.all([dataP,packsP,coursesP]).then(function(items){var data=items[0],packs=items[1];
    if(!data||data.format!=='parlo-app-data'||!data.modules||!data.registries||!data.learning)throw Error('not a Parlo content folder');
    window.__UII18N.init(packMap(window.__LANGS,packs),data);if(data.languageNames)window.__UII18N_setNames(data.languageNames);window.__UII18N_ready=1;document.title=window.__t('app_title');
    window.__D=makeD(data);run();
  }).catch(function(e){
    packsP.then(function(packs){var ok=packs[0]&&packs[0].strings&&Object.keys(packs[0].strings).length;
      if(ok){window.__UII18N.init(packMap(window.__LANGS,packs),null);window.__UII18N_ready=1}
      var msg=String(e&&e.message||e).replace(/[<>&]/g,'');
      showError(ok?window.__t('data_error_title'):'',ok?window.__t('data_error_text',file,msg):'<b>'+file+'</b> ('+msg+')')})})
})();
